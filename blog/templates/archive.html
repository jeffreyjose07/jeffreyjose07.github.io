<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive - Jeffrey Jose</title>
    <meta name="description" content="Archive of all blog posts by Jeffrey Jose" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="alternate" type="application/rss+xml" title="RSS Feed" href="/blog/feed.xml" />

    {{styles}}

    <style>
        body {
            padding-top: 110px;
        }

        .archive-container {
            max-width: 820px;
            margin: 0 auto;
        }

        .archive-header {
            text-align: center;
            margin-bottom: 3.5rem;
        }

        .archive-title {
            font-size: 3rem;
            margin-bottom: 0.75rem;
            color: var(--foreground);
            font-family: var(--font-heading);
            letter-spacing: -0.03em;
        }

        .archive-stats {
            color: var(--muted-foreground);
            font-size: 1.05rem;
            font-family: var(--font-sans);
        }

        .year-section {
            margin-bottom: 3.5rem;
            position: relative;
        }

        .year-title {
            font-size: 1.75rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: baseline;
            gap: 1rem;
            font-family: var(--font-heading);
            letter-spacing: -0.02em;
        }

        .year-count {
            font-size: 0.875rem;
            color: var(--muted-foreground);
            font-family: var(--font-mono);
            font-weight: normal;
        }

        .post-list {
            list-style: none;
            padding: 0;
            display: grid;
            gap: 0.75rem;
        }

        .archive-item {
            display: block;
            text-decoration: none;
            padding: 1.25rem 1.5rem;
            border-radius: 0.75rem;
            transition: all 0.25s ease;
            position: relative;
            background: #111114;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .archive-item:hover {
            transform: translateY(-2px);
            background: #141418;
            border-color: rgba(28, 201, 160, 0.35);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6), 0 0 15px -3px rgba(28, 201, 160, 0.15);
        }

        .archive-item-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1.5rem;
        }

        .archive-post-info {
            flex: 1;
        }

        .archive-post-meta {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.35rem;
            font-size: 0.8125rem;
            color: var(--muted-foreground);
        }

        .episode-number {
            font-family: var(--font-mono);
            color: var(--primary);
            background: rgba(28, 201, 160, 0.1);
            padding: 0.15rem 0.45rem;
            border-radius: 4px;
            font-size: 0.75rem;
            border: 1px solid rgba(28, 201, 160, 0.25);
        }

        .archive-post-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--foreground);
            transition: color 0.2s;
            font-family: var(--font-heading);
            letter-spacing: -0.01em;
        }

        .archive-item:hover .archive-post-title {
            color: var(--primary);
        }

        .archive-post-date {
            font-family: var(--font-mono);
            color: var(--muted-foreground);
            font-size: 0.8125rem;
            white-space: nowrap;
        }

        @media (max-width: 640px) {
            .archive-item-content {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.75rem;
            }

            .archive-post-date {
                font-size: 0.75rem;
            }
        }
    </style>
</head>

<body class="bg-mesh">
    {{siteHeader}}

    <main class="container" id="main-content">
        <div class="archive-container">
            <header class="archive-header">
                <div class="dev-badge" style="margin-bottom: 1.25rem;">
                    // ARCHIVE
                </div>
                <h1 class="archive-title">All <span class="text-gradient-premium">Writing</span></h1>
                <p class="archive-stats">
                    {{totalPosts}} posts published
                </p>
            </header>

            <div class="timeline">
                {{archiveContent}}
            </div>

            <div style="text-align: center; margin-top: 4rem; margin-bottom: 3rem;">
                <a href="/blog/" class="glass"
                    style="display: inline-flex; align-items: center; padding: 0.6rem 1.25rem; border-radius: 9999px; text-decoration: none; color: var(--foreground); font-weight: 500; font-size: 0.875rem; font-family: var(--font-mono); transition: border-color 0.2s, color 0.2s;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        style="margin-right: 0.5rem;">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Back to Articles
                </a>
            </div>
        </div>
    </main>

    <!-- GoatCounter Analytics -->
    <script data-goatcounter="https://jeffreyjose.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>

</html>
