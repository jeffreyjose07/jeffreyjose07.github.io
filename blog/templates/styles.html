<!-- Google Fonts (aligned with modernized developer portfolio) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
    rel="stylesheet">

<style>
    :root {
        --background: #09090b;
        --foreground: #fafafa;

        --primary: #1cc9a0;
        /* Mirrors --primary-foreground in src/index.css. Near-black on teal:
           white failed WCAG AA contrast on every primary surface. */
        --primary-foreground: #09090b;
        --primary-glow: #5eead4;

        --secondary: #111114;
        --secondary-foreground: #fafafa;

        --muted: #18181b;
        --muted-foreground: #a1a1aa;

        --accent: #18181b;
        --accent-foreground: #fafafa;

        --border: rgba(255, 255, 255, 0.08);
        --input: #27272a;

        --font-sans: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-heading: 'Inter', 'Plus Jakarta Sans', system-ui, sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, 'Menlo', 'Monaco', monospace;

        --gradient-hero: linear-gradient(135deg, #09090b, #0c1f1a);
        --gradient-card: linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.01));
        --gradient-accent: linear-gradient(135deg, #1cc9a0, #22d3ee);
        --radius: 0.75rem;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: var(--font-sans);
        background-color: var(--background);
        background-image: 
            radial-gradient(ellipse 80% 50% at 50% -20%, rgba(28, 201, 160, 0.08), transparent 70%),
            linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
        background-size: 100% 100%, 36px 36px, 36px 36px;
        color: var(--foreground);
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
        max-width: 100vw;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
        font-family: var(--font-heading);
        font-weight: 700;
        line-height: 1.25;
        margin-bottom: 1rem;
        letter-spacing: -0.03em;
    }

    a {
        color: inherit;
        text-decoration: none;
        transition: color 0.2s ease;
    }

    .container {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 1.5rem;
    }

    .panel-card,
    .glass-card {
        background: var(--secondary);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        position: relative;
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .panel-card::before,
    .glass-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(28, 201, 160, 0.4), transparent);
        opacity: 0;
        transition: opacity 0.3s ease;
        pointer-events: none;
        border-top-left-radius: var(--radius);
        border-top-right-radius: var(--radius);
    }

    .panel-card:hover,
    .glass-card:hover {
        border-color: rgba(28, 201, 160, 0.35);
        transform: translateY(-2px);
        box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.6), 0 0 20px -5px rgba(28, 201, 160, 0.15);
    }

    .panel-card:hover::before,
    .glass-card:hover::before {
        opacity: 1;
    }

    .glass {
        background: rgba(17, 17, 20, 0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--border);
    }

    .text-gradient-premium {
        background: linear-gradient(135deg, #fff 10%, #5eead4 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        color: transparent;
        display: inline-block;
    }

    .bg-mesh {
        background-color: var(--background);
    }

    .dev-badge {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        padding: 0.25rem 0.6rem;
        border-radius: 0.375rem;
        background: rgba(28, 201, 160, 0.1);
        color: var(--primary);
        border: 1px solid rgba(28, 201, 160, 0.25);
        display: inline-flex;
        align-items: center;
        gap: 0.375rem;
    }

    ::-webkit-scrollbar {
        width: 8px;
    }

    ::-webkit-scrollbar-track {
        background: var(--background);
    }

    ::-webkit-scrollbar-thumb {
        background: #27272a;
        border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
        background: #3f3f46;
    }

    .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
    }
</style>
