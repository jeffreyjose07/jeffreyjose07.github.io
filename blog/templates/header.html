<style>
    /* Modern Floating Island Header */
    .site-header {
        position: fixed;
        top: 1rem;
        left: 0;
        right: 0;
        z-index: 1000;
        display: flex;
        justify-content: center;
        padding: 0 1rem;
        pointer-events: none;
        transition: all 0.3s ease;
    }

    .header-inner {
        width: 100%;
        max-width: 960px;
        pointer-events: auto;
        padding: 0.5rem 1.15rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        background: rgba(9, 9, 11, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 9999px;
        box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6), 0 0 15px -3px rgba(28, 201, 160, 0.1);
        transition: all 0.25s ease;
    }

    .site-logo {
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 1.05rem;
        color: var(--foreground);
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        letter-spacing: -0.02em;
    }

    .logo-status-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.15rem 0.55rem;
        font-family: var(--font-mono);
        font-size: 0.7rem;
        color: var(--primary);
        background: rgba(28, 201, 160, 0.1);
        border: 1px solid rgba(28, 201, 160, 0.25);
        border-radius: 9999px;
    }

    .status-pulse-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: var(--primary);
        box-shadow: 0 0 6px var(--primary);
        animation: pulseGlow 2s infinite;
    }

    @keyframes pulseGlow {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
    }

    .text-gradient-premium {
        background: linear-gradient(135deg, #fff 10%, #5eead4 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        color: transparent;
        display: inline-block;
    }

    .site-nav {
        display: flex;
        align-items: center;
        gap: 0.35rem;
    }

    .nav-link {
        font-family: var(--font-sans);
        font-size: 0.8125rem;
        font-weight: 500;
        color: var(--muted-foreground);
        text-decoration: none;
        padding: 0.35rem 0.75rem;
        border-radius: 9999px;
        transition: all 0.2s ease;
    }

    .nav-link:hover {
        color: var(--foreground);
        background: rgba(255, 255, 255, 0.06);
    }

    .nav-link.active {
        color: var(--foreground);
        background: rgba(255, 255, 255, 0.1);
        font-weight: 600;
    }

    /* Search Button */
    .search-trigger {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: var(--muted-foreground);
        padding: 0.35rem 0.75rem;
        border-radius: 9999px;
        font-size: 0.8125rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 0.45rem;
        transition: all 0.2s ease;
        font-family: var(--font-mono);
    }

    .search-trigger:hover {
        background: rgba(255, 255, 255, 0.1);
        color: var(--foreground);
        border-color: rgba(28, 201, 160, 0.35);
    }

    .search-text,
    .search-shortcut {
        display: none;
    }

    @media (min-width: 768px) {
        .search-text {
            display: inline;
        }

        .search-shortcut {
            display: inline-flex;
            font-size: 0.7rem;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 4px;
            padding: 0.05rem 0.35rem;
            color: var(--muted-foreground);
        }
    }

    /* Mobile Menu */
    .mobile-menu-toggle {
        display: none;
        background: none;
        border: none;
        color: var(--foreground);
        cursor: pointer;
        padding: 0.35rem;
    }

    @media (max-width: 768px) {
        .site-nav {
            display: none;
            position: absolute;
            top: calc(100% + 0.5rem);
            left: 1rem;
            right: 1rem;
            flex-direction: column;
            background: #111114;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 1rem;
            padding: 1rem;
            gap: 0.5rem;
            align-items: stretch;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
        }

        .site-nav.open {
            display: flex;
            animation: slideDown 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .mobile-menu-toggle {
            display: block;
        }

        .nav-link {
            padding: 0.6rem 1rem;
            border-radius: 0.5rem;
            text-align: left;
        }
    }

    @keyframes slideDown {
        from {
            opacity: 0;
            transform: translateY(-8px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Search Modal */
    .search-modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        z-index: 2000;
        align-items: flex-start;
        justify-content: center;
        padding-top: 100px;
        opacity: 0;
        transition: opacity 0.25s ease;
    }

    .search-modal-overlay.open {
        display: flex;
        opacity: 1;
    }

    .search-modal {
        background: #101013;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 1rem;
        width: 90%;
        max-width: 600px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 25px -5px rgba(28, 201, 160, 0.2);
        overflow: hidden;
        transform: scale(0.96);
        transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .search-modal-overlay.open .search-modal {
        transform: scale(1);
    }

    .search-input-container {
        padding: 1.25rem 1.5rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
    }

    .search-icon {
        color: var(--primary);
        margin-right: 0.85rem;
        flex-shrink: 0;
    }

    .search-input {
        background: transparent;
        border: none;
        color: var(--foreground);
        font-size: 1.05rem;
        width: 100%;
        outline: none;
        font-family: var(--font-sans);
    }

    .search-input::placeholder {
        color: var(--muted-foreground);
    }

    .search-results {
        max-height: 400px;
        overflow-y: auto;
        padding: 0.75rem;
    }

    .search-result-item {
        display: block;
        padding: 0.85rem 1rem;
        text-decoration: none;
        color: var(--muted-foreground);
        border-radius: 0.5rem;
        transition: all 0.2s ease;
        margin-bottom: 0.25rem;
        border: 1px solid transparent;
    }

    .search-result-item:hover {
        background: rgba(255, 255, 255, 0.05);
        border-color: rgba(28, 201, 160, 0.25);
        color: var(--foreground);
    }

    .search-result-title {
        font-weight: 600;
        font-size: 0.95rem;
        color: var(--foreground);
        margin-bottom: 0.25rem;
        font-family: var(--font-heading);
    }

    .search-result-item:hover .search-result-title {
        color: var(--primary);
    }

    .search-result-excerpt {
        font-size: 0.8125rem;
        color: var(--muted-foreground);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
</style>

<header class="site-header" id="siteHeader">
    <div class="header-inner">
        <a href="/" class="site-logo">
            <span>Jeffrey<span style="color: var(--primary)">.</span><span
                    class="text-gradient-premium">Jose</span></span>
            <span class="logo-status-pill">
                <span class="status-pulse-dot"></span>
                blog
            </span>
        </a>

        <nav class="site-nav">
            <a href="/#hero" class="nav-link">Home</a>
            <a href="/#experience" class="nav-link">Experience</a>
            <a href="/#skills" class="nav-link">Skills</a>
            <a href="/#projects" class="nav-link">Projects</a>
            <a href="/blog/" class="nav-link active">Blog</a>
            <a href="/#contact" class="nav-link">Contact</a>
        </nav>

        <div style="display: flex; align-items: center; gap: 0.75rem;">
            <button class="search-trigger" onclick="openSearch()" aria-label="Search posts">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <span class="search-text">Search</span>
                <span class="search-shortcut">⌘K</span>
            </button>

            <button class="mobile-menu-toggle" aria-label="Toggle menu"
                onclick="document.querySelector('.site-nav').classList.toggle('open')">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
        </div>
    </div>
</header>

<!-- Search Modal HTML -->
<div class="search-modal-overlay" id="searchModal" onclick="if(event.target === this) closeSearch()">
    <div class="search-modal">
        <div class="search-input-container">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" class="search-input" placeholder="Search posts by topic, title, or tags..." id="searchInput" autocomplete="off">
        </div>
        <div class="search-results" id="searchResults">
            <!-- Results will be injected here -->
        </div>
    </div>
</div>

<script>
    let searchIndex = [];
    let isSearchOpen = false;

    async function loadSearchIndex() {
        if (searchIndex.length > 0) return;
        try {
            const response = await fetch('/blog/search.json');
            searchIndex = await response.json();
        } catch (e) {
            console.error('Failed to load search index', e);
        }
    }

    function openSearch() {
        document.getElementById('searchModal').classList.add('open');
        document.getElementById('searchInput').focus();
        isSearchOpen = true;
        loadSearchIndex();
        document.body.style.overflow = 'hidden';
    }

    function closeSearch() {
        document.getElementById('searchModal').classList.remove('open');
        isSearchOpen = false;
        document.body.style.overflow = '';
    }

    function performSearch(query) {
        if (!query) {
            document.getElementById('searchResults').innerHTML = '';
            return;
        }

        const results = searchIndex.filter(post => {
            const titleMatch = post.title.toLowerCase().includes(query.toLowerCase());
            const descMatch = post.description && post.description.toLowerCase().includes(query.toLowerCase());
            const tagMatch = post.tags && post.tags.some(tag => tag.toLowerCase().includes(query.toLowerCase()));
            return titleMatch || descMatch || tagMatch;
        }).slice(0, 5); // Limit to 5 results

        const resultsHtml = results.map(post => `
            <a href="/blog/${post.slug}/" class="search-result-item" onclick="closeSearch()">
                <div class="search-result-title">${post.title}</div>
                <div class="search-result-excerpt">${post.description || ''}</div>
            </a>
        `).join('');

        document.getElementById('searchResults').innerHTML = results.length > 0
            ? resultsHtml
            : '<div style="padding: 1.5rem; color: var(--muted-foreground); text-align: center; font-size: 0.9rem;">No matching articles found</div>';
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
        performSearch(e.target.value);
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
            e.preventDefault();
            if (isSearchOpen) closeSearch();
            else openSearch();
        }
        if (e.key === 'Escape' && isSearchOpen) {
            closeSearch();
        }
    });
</script>
