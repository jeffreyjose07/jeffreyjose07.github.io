name: Build and Deploy Portfolio with Blog

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    # PRs default to a detached merge ref — git push then fails with
    # "fatal: You are not currently on a branch." Checkout the PR head
    # branch (or the pushed branch) so commit+push has a real ref.
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
        persist-credentials: true
        ref: ${{ github.head_ref || github.ref_name }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Check for blog changes
      id: blog-changes
      run: |
        if git diff --name-only HEAD~1 HEAD | grep -E '^blog/(posts|templates|scripts|config\.json)' > /dev/null 2>&1 || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "blog_changed=true" >> $GITHUB_OUTPUT
          echo "📝 Blog content changes detected or manual trigger"
        else
          echo "blog_changed=false" >> $GITHUB_OUTPUT
          echo "📝 No blog content changes detected"
        fi
    
    - name: Build blog
      if: steps.blog-changes.outputs.blog_changed == 'true'
      run: |
        echo "🚀 Building blog with semantic coloring..."
        npm run build:blog
        echo "✅ Blog build completed"

    # A green exit code is not proof the build produced usable HTML. Two past
    # regressions exited 0 while shipping garbage: the marked v9 token API
    # change emitted "[object Object]" into every paragraph across 34 posts,
    # and an entry-guard bug made the script a silent no-op. Assert on the
    # artifact, not the exit status.
    - name: Verify blog output
      if: steps.blog-changes.outputs.blog_changed == 'true'
      run: |
        set -euo pipefail

        if [ ! -d public/blog ] || [ -z "$(find public/blog -name 'index.html' -print -quit)" ]; then
          echo "::error::Blog build produced no HTML in public/blog/."
          exit 1
        fi

        # Renderer regressions stringify token objects into the prose. Match the
        # rendered *signature* — a block element whose content begins with the
        # stringified object — not the bare string, because post 034 discusses
        # "[object Object]" as prose and must not trip this check.
        SIGNATURE='<(p|li|h[1-6]|td|th|blockquote)>\[object Object\]'
        STRINGIFIED=$(grep -rlE "$SIGNATURE" public/blog --include='*.html' || true)
        if [ -n "$STRINGIFIED" ]; then
          echo "::error::Rendered HTML contains stringified tokens — renderer signature regression."
          echo "$STRINGIFIED" | while read -r f; do
            echo "  $f ($(grep -oE "$SIGNATURE" "$f" | wc -l | tr -d ' ') occurrences)"
          done
          exit 1
        fi

        echo "✅ Verified $(find public/blog -name 'index.html' | wc -l | tr -d ' ') pages, no stringified objects"

    - name: Check for generated blog files
      if: steps.blog-changes.outputs.blog_changed == 'true'
      id: blog-generated
      run: |
        # Thumbnails live under public/assets/thumbnails/ (not public/blog/).
        # Previously we only committed public/blog/, so new PNGs were generated
        # on the runner and then discarded — broken <img> on the index.
        if [ -n "$(git status --porcelain public/blog/ public/assets/thumbnails/)" ]; then
          echo "files_generated=true" >> $GITHUB_OUTPUT
          echo "📄 Generated blog/thumbnail files detected:"
          git status --porcelain public/blog/ public/assets/thumbnails/
        else
          echo "files_generated=false" >> $GITHUB_OUTPUT
          echo "📄 No new blog files generated"
        fi
    
    - name: Commit generated blog files
      if: steps.blog-changes.outputs.blog_changed == 'true' && steps.blog-generated.outputs.files_generated == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        BRANCH="${{ github.head_ref || github.ref_name }}"
        git checkout -B "$BRANCH"
        
        git add public/blog/ public/assets/thumbnails/
        
        CHANGED_POSTS=$(git diff --name-only HEAD~1 HEAD | grep 'blog/posts/' | sed 's|blog/posts/||g' | sed 's|\.md$||g' | tr '\n' ',' | sed 's/,$//' || echo "")
        
        if [ -n "$CHANGED_POSTS" ]; then
          git commit -m "auto: rebuild blog posts ($CHANGED_POSTS)
          
          Generated HTML files and terminal thumbnails from Markdown source."
        else
          git commit -m "auto: rebuild blog
          
          Generated HTML files and terminal thumbnails from updated templates or configuration."
        fi
        
        git push origin "HEAD:$BRANCH"
        echo "✅ Blog files and thumbnails committed and pushed to $BRANCH"
    
    - name: Build portfolio
      run: |
        echo "🚀 Building portfolio website..."
        npm run build
        echo "✅ Portfolio build completed"
    
    # Only publish GitHub Pages from main (not from PR builds)
    - name: Setup Pages
      if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      uses: actions/configure-pages@v6
    
    - name: Upload artifact
      if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      uses: actions/upload-pages-artifact@v5
      with:
        path: './dist'
    
    - name: Deploy to GitHub Pages
      if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      id: deployment
      uses: actions/deploy-pages@v5
      
    - name: Deployment summary
      run: |
        echo "🎉 Job completed successfully!"
        if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "🌐 Portfolio URL: ${{ steps.deployment.outputs.page_url }}"
        else
          echo "ℹ️ PR build: blog HTML committed back to branch; Pages deploy skipped until merge to main."
        fi
        if [ "${{ steps.blog-changes.outputs.blog_changed }}" == "true" ]; then
          echo "📝 Blog has been updated with semantic coloring"
        fi
